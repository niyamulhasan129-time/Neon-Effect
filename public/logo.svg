<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Top Word: NEON (Magenta Pink) -->
  <text
    x="256"
    y="172"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif"
    font-size="118"
    font-weight="900"
    letter-spacing="2"
    fill="#ff00e6"
    filter="url(#shadow)"
  >NEON</text>

  <!-- Middle Box: Rounded Black Pill with GLOW (Electric Green) -->
  <g filter="url(#shadow)">
    <rect
      x="70"
      y="202"
      width="372"
      height="116"
      rx="24"
      ry="24"
      fill="#050505"
    />
    <text
      x="256"
      y="294"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif"
      font-size="108"
      font-weight="900"
      letter-spacing="4"
      fill="#00e800"
    >GLOW</text>
  </g>

  <!-- Bottom Word: EFFECT (Vibrant Red) -->
  <text
    x="256"
    y="440"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif"
    font-size="112"
    font-weight="900"
    letter-spacing="2"
    fill="#e52620"
    filter="url(#shadow)"
  >EFFECT</text>
</svg>
